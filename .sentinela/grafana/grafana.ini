[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[security]
cookie_secure = false
cookie_samesite = lax
allow_embedding = true

[auth.anonymous]
enabled = true
org_id = 1
org_role = Admin

[auth]
disable_login_form = true

[feature_toggles]
enable = tempoSearch,tempoServiceGraph,traceToLogs,traceToMetrics,canvasPanel,correlations,recordedQueries,logsContext,logsDataLinks

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/app/app.json

[tracing.otel]
endpoint = opentelemetry:4317
service_name = grafana-internal

[alerting]
enabled = false
[unified_alerting]
enabled = false