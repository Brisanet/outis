server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces/blocks
    wal:
      path: /var/tempo/traces/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  
  processor:
    span_metrics:
      dimensions:
        - service_name
        - service.name
    service_graphs:
      dimensions:
        - service_name
        - service.name
  ring:
    kvstore:
      store: inmemory

overrides:
  metrics_generator_processors: [service-graphs, span-metrics]